<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Wi-Fi pilot: invisible light</title>
<style>
  html, body { margin: 0; background: #fff; }
  #stage { display: block; width: 854px; height: 480px; background: #fff; filter: url(#onpaper); }
  .ink { fill: none; stroke: #050505; stroke-width: calc(5px * var(--k, 1)); stroke-linecap: round; stroke-linejoin: round; }
  .thin { stroke-width: calc(3.2px * var(--k, 1)); }
  .hair { stroke-width: calc(2.2px * var(--k, 1)); }
  .dot { fill: #050505; stroke: none; }
  .blue { fill: #2457d6; stroke: none; }
  .orange { fill: #ee8420; stroke: none; }
  .wave { fill: none; stroke: #2457d6; stroke-width: calc(5px * var(--k, 1)); stroke-linecap: round; }
  .txt { font-family: "Patrick Hand", "Comic Sans MS", cursive; fill: #050505; stroke: none; }
</style>
</head>
<body>
<!-- The paper: creases stay still, the ink grain changes every few frames so the lines feel hand-drawn. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="onpaper" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="turbulence" baseFrequency="0.006 0.008" numOctaves="5" seed="17" result="crease"/>
    <feTurbulence id="grainNoise" type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="24" result="grainRaw"/>
    <feColorMatrix in="grainRaw" type="matrix" values="2.4 0 0 0 -0.7  2.4 0 0 0 -0.7  2.4 0 0 0 -0.7  0 0 0 0 1" result="grain"/>
    <feDisplacementMap in="SourceGraphic" in2="crease" scale="10" xChannelSelector="R" yChannelSelector="G" result="bent"/>
    <feDisplacementMap in="bent" in2="grainRaw" scale="2.2" xChannelSelector="G" yChannelSelector="B" result="roughRaw"/>
    <feFlood flood-color="#ffffff" result="white"/>
    <feComposite in="roughRaw" in2="white" operator="over" result="rough"/>
    <feComposite in="rough" in2="grain" operator="arithmetic" k1="-0.2" k2="1" k3="0.2" k4="0" result="inked"/>
    <feDiffuseLighting in="crease" surfaceScale="5" diffuseConstant="1" lighting-color="white" result="lightRaw"><feDistantLight azimuth="40" elevation="30"/></feDiffuseLighting>
    <feComponentTransfer in="lightRaw" result="light"><feFuncR type="linear" slope="0.8" intercept="0.12"/><feFuncG type="linear" slope="0.8" intercept="0.12"/><feFuncB type="linear" slope="0.8" intercept="0.12"/></feComponentTransfer>
    <feBlend in="light" in2="inked" mode="hard-light"/>
  </filter>
</defs></svg>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><text id="measure" class="txt" font-size="27"></text></svg>
<svg id="stage" viewBox="0 0 854 480"></svg>
<script src="common.js"></script>
<script>
// Scene 2, "Invisible light". Timed entirely from the owner's recording: every action is placed
// at a line's start or at the moment a particular word is spoken (wordTime).
let LINES = [], L = {}, T = {};
const DAD_X = 170, KID_X = 690;
const PANEL = { x: 285, y: 126, w: 290, h: 160 };   // the drawing board between the two of them
const PCX = PANEL.x + PANEL.w / 2, PCY = PANEL.y + PANEL.h / 2;

window.setup = function (lines, opts = {}) {
  LINES = lines; L = {}; T = {}; EVENTS = opts.events || [];
  lines.forEach(l => { L[l.id] = l; });
  const w = (id, word, nth, fallback) => { const x = wordTime(L[id], word, nth); return x == null ? fallback : x; };
  T.panel = L.k8.a;                                         // the board appears with "Like a ghost?"
  T.ghost = L.k8.a;
  T.lamp = L.d5.a;
  T.routerIsLamp = L.d6.a;
  T.cantSee = w('d6', 'but', 0, L.d6.a + (L.d6.b - L.d6.a) * 0.55);
  T.radio = L.d7.a;
  T.car = w('d7', 'same', 0, L.d7.a + (L.d7.b - L.d7.a) * 0.5);
  T.zoomIn = Math.max(L.d7.b, L.k11.a - 0.3);
  T.zoomOut = Math.min(L.k11.b + 0.1, L.d8.a - 0.3);
  T.flash = L.d8.a;
  // "On, off, on, on, off": the beam switches on each word as it is said
  const ons = [0, 1, 2].map(n => w('d8', 'on', n, null)), offs = [0, 1].map(n => w('d8', 'off', n, null));
  T.blinks = [[ons[0], 1], [offs[0], 0], [ons[1], 1], [ons[2], 1], [offs[1], 0]].filter(b => b[0] != null).sort((a, b) => a[0] - b[0]);
  T.fast = L.d9.a;
  T.millions = w('d9', 'millions', 0, L.d9.a + (L.d9.b - L.d9.a) * 0.7);
  T.tablet = L.d10.a;
  T.tiny = w('d10', 'tiny', 0, L.d10.a + 1);
  T.picture = w('d10', 'picture', 0, L.d10.b - 0.6);
  T.dots = L.d11.a;
  T.end = Math.max(opts.duration || 0, L.d11.b) + 0.8;
  window.TIMELINE = { lines: LINES.map(l => ({ id: l.id, a: l.a, b: l.b })), end: T.end };
  window.TOTAL_FRAMES = Math.ceil(T.end * FPS);
  window.renderFrame(0);
};

// ---- things drawn on the board (each draws itself in from p = 0 to 1) ----

function ghost(p, t) {
  const bob = Math.sin(t * 4) * 4;
  return `<g class="ink" transform="translate(${PCX} ${PCY + bob})">
    <path ${draw(p)} d="M-38 46 V-8 A38 38 0 0 1 38 -8 V46 L25 34 L12 46 L0 34 L-12 46 L-25 34 Z" fill="#ffffff"/>
    ${p >= 1 ? '<circle class="dot" cx="-13" cy="-6" r="5"/><circle class="dot" cx="13" cy="-6" r="5"/><ellipse class="dot" cx="0" cy="14" rx="5" ry="7"/>' : ''}
  </g>`;
}

function lamp(x, y, p, t, scale = 1) {
  let rays = '';
  if (p >= 1) {
    for (let k = 0; k < 10; k++) {                         // light leaving in every direction
      const ang = (k / 10) * Math.PI * 2 + 0.3;
      const r0 = 34 + ((t * 40 + k * 7) % 30), r1 = r0 + 14;
      rays += `<path class="thin" d="M${(Math.cos(ang) * r0).toFixed(1)} ${(Math.sin(ang) * r0 - 22).toFixed(1)} L${(Math.cos(ang) * r1).toFixed(1)} ${(Math.sin(ang) * r1 - 22).toFixed(1)}"/>`;
    }
  }
  return `<g class="ink" transform="translate(${x} ${y}) scale(${scale})">
    <path ${draw(p)} d="M-24 -6 L-14 -38 H14 L24 -6 Z M0 -6 V40 M-20 40 H20" fill="#ffffff"/>
    ${rays}
  </g>`;
}

function router(x, y, p, scale = 1) {
  return `<g class="ink" transform="translate(${x} ${y}) scale(${scale})">
    <rect x="-45" y="-15" width="90" height="30" rx="6" fill="#ffffff" ${draw(p)}/>
    <path d="M-29 -15 L-37 -47 M29 -15 L37 -47" ${draw(p)}/>
    ${p >= 1 ? '<circle class="dot" cx="-27" cy="0" r="3"/><circle class="blue" cx="-13" cy="0" r="4"/><circle class="dot" cx="1" cy="0" r="3"/>' : ''}
  </g>`;
}

function crossedEye(x, y, p) {
  return `<g class="ink" transform="translate(${x} ${y})">
    <path ${draw(p)} d="M-30 0 Q0 -24 30 0 Q0 24 -30 0 Z" fill="#ffffff"/>
    ${p >= 1 ? '<circle class="dot" cx="0" cy="0" r="7"/>' : ''}
    <path ${draw(seg(p, 0.6, 1))} d="M-30 22 L30 -22"/>
  </g>`;
}

function car(x, y, p, t) {
  const notes = p >= 1 ? [0, 1, 2].map(k => {
    const q = ((t * 0.7 + k / 3) % 1);
    return `<text class="txt" x="${(x + 46 + q * 40).toFixed(1)}" y="${(y - 30 - q * 46).toFixed(1)}" font-size="${(26 - q * 6).toFixed(1)}" opacity="${(1 - q).toFixed(2)}">♪</text>`;
  }).join('') : '';
  return `<g class="ink" transform="translate(${x} ${y})">
    <path ${draw(p)} d="M-58 10 V-6 L-44 -10 L-28 -30 H22 L40 -10 L58 -6 V10 Z" fill="#ffffff"/>
    <path ${draw(p)} d="M-24 -26 L-14 -12 M8 -26 V-12 M40 -10 L52 -48"/>
    <circle ${draw(p)} cx="-32" cy="12" r="10" fill="#ffffff"/><circle ${draw(p)} cx="32" cy="12" r="10" fill="#ffffff"/>
  </g>${notes}`;
}

function flashlight(x, y, p, on) {
  const beam = on ? `<path d="M${x + 44} ${y - 13} L${x + 128} ${y - 44} L${x + 128} ${y + 44} L${x + 44} ${y + 13} Z" fill="#ee8420" opacity="0.55" stroke="none"/>
    <path class="thin" d="M${x + 44} ${y - 13} L${x + 128} ${y - 44} M${x + 44} ${y + 13} L${x + 128} ${y + 44}"/>` : '';
  return `${beam}<g class="ink" transform="translate(${x} ${y})">
    <path ${draw(p)} d="M-60 -9 H20 L44 -18 V18 L20 9 H-60 Z" fill="#ffffff"/>
    <path ${draw(p)} d="M-28 -9 V-15 H-16 V-9"/>
  </g>`;
}

function tablet(x, y, p) {
  return `<g class="ink" transform="translate(${x} ${y})">
    <rect x="-80" y="-58" width="160" height="116" rx="12" fill="#ffffff" ${draw(p)}/>
    <rect x="-66" y="-46" width="132" height="92" rx="4" ${draw(seg(p, 0.4, 1))}/>
  </g>`;
}

// The cartoon on the tablet: a smiling sun, drawn as lines or as a grid of blue "blinks".
function sun(x, y, p) {
  let r = '';
  for (let k = 0; k < 8; k++) {
    const a = k * Math.PI / 4;
    r += `M${(x + Math.cos(a) * 24).toFixed(1)} ${(y + Math.sin(a) * 24).toFixed(1)} L${(x + Math.cos(a) * 34).toFixed(1)} ${(y + Math.sin(a) * 34).toFixed(1)} `;
  }
  return `<g class="ink thin">
    <circle cx="${x}" cy="${y}" r="17" fill="#ffffff" ${draw(p)}/>
    <path ${draw(seg(p, 0.4, 1))} d="${r}"/>
    ${p >= 1 ? `<circle class="dot" cx="${x - 6}" cy="${y - 4}" r="2.2"/><circle class="dot" cx="${x + 6}" cy="${y - 4}" r="2.2"/><path class="hair" d="M${x - 7} ${y + 5} Q${x} ${y + 11} ${x + 7} ${y + 5}"/>` : ''}
  </g>`;
}

function sunInBlinks(x, y, p, t) {
  let out = '';
  const step = 9;
  for (let gx = -6; gx <= 6; gx++) for (let gy = -4; gy <= 4; gy++) {
    const px = x + gx * step, py = y + gy * step, d = Math.hypot(gx * step, gy * step);
    const inSun = d < 19 || (d > 24 && d < 36 && Math.round(Math.atan2(gy, gx) / (Math.PI / 4)) * (Math.PI / 4) === Math.atan2(gy, gx));
    const show = (gx + gy * 13 + 40) % 40 / 40 < p;
    if (!show) continue;
    const lit = inSun && Math.floor(t * 12 + gx * 3 + gy * 5) % 7 !== 0;
    out += lit ? `<circle class="blue" cx="${px}" cy="${py}" r="3.6"/>` : `<circle class="dot" cx="${px}" cy="${py}" r="1.2" opacity="0.5"/>`;
  }
  return out;
}

// ---- the frame ----

function scene(tRaw) {
  const t = Math.floor(tRaw * 12) / 12;
  const line = LINES.find(l => between(tRaw, l.a, l.b));
  let out = `<path d="M40 ${GROUND + 2} H814" fill="none" stroke="#050505" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>`;

  // The router on its table, as at the end of the cold open
  out += `<g class="ink"><path d="M340 372 H500 M356 372 L350 ${GROUND} M484 372 L490 ${GROUND}"/></g>` + router(420, 353, 1);

  // "Your cartoon flies across the room": little blue specks travel from the router to her tablet
  if (tRaw < L.k8.a + 0.3) {
    const fade = 1 - seg(tRaw, L.k8.a, L.k8.a + 0.3);
    for (let k = 0; k < 6; k++) {
      const q = (tRaw * 0.55 + k / 6) % 1;
      const x = 457 + (KID_X - 40 - 457) * q, y = 306 + (362 - 306) * q - Math.sin(q * Math.PI) * 70;
      out += `<circle class="blue" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" opacity="${(fade * Math.sin(q * Math.PI)).toFixed(2)}"/>`;
    }
  }

  // The drawing board and what is on it
  const zoomed = between(tRaw, T.zoomIn, T.zoomOut + 0.3);
  if (tRaw >= T.panel && !zoomed) {
    const pp = seg(tRaw, T.panel, T.panel + 0.5);
    out += `<rect class="ink" x="${PANEL.x}" y="${PANEL.y}" width="${PANEL.w}" height="${PANEL.h}" rx="14" fill="#ffffff" ${draw(pp)}/>`;
    // everything on the board stays inside its edge
    out += `<defs><clipPath id="board"><rect x="${PANEL.x + 3}" y="${PANEL.y + 3}" width="${PANEL.w - 6}" height="${PANEL.h - 6}" rx="12"/></clipPath></defs><g clip-path="url(#board)">`;
    const d = (a, len = 0.7) => seg(tRaw, a, a + len);
    if (tRaw < T.lamp) out += ghost(d(T.ghost, 0.8), t);
    else if (tRaw < T.routerIsLamp) out += lamp(PCX, PCY + 26, d(T.lamp), t);
    else if (tRaw < T.cantSee) {
      out += router(PCX - 80, PCY + 30, d(T.routerIsLamp), 0.8) + lamp(PCX + 82, PCY + 26, 1, t, 0.85);
      out += `<text class="txt" x="${PCX}" y="${PCY + 20}" font-size="46" text-anchor="middle" opacity="${d(T.routerIsLamp + 0.6, 0.3).toFixed(2)}">=</text>`;
    } else if (tRaw < T.radio) {
      out += rings(PCX - 60, PCY + 10, tRaw, { max: 110, speed: 50, dashed: true }) + router(PCX - 60, PCY + 28, 1, 0.65);
      out += crossedEye(PCX + 85, PCY, d(T.cantSee + 0.3));
    } else if (tRaw < T.car) {
      out += rings(PCX, PCY + 6, tRaw, { max: 120, speed: 55 }) + router(PCX, PCY + 26, 1, 0.65);
      out += `<text class="txt" x="${PCX}" y="${PANEL.y + PANEL.h - 14}" font-size="26" text-anchor="middle" opacity="${d(T.radio + 0.3, 0.4).toFixed(2)}">radio waves</text>`;
    } else if (tRaw < T.flash) {
      out += rings(PCX - 95, PCY - 30, tRaw, { max: 90, speed: 45, count: 3 }) + car(PCX + 20, PCY + 40, d(T.car), tRaw);
    } else if (tRaw < T.fast) {
      let on = 0, seq = '';
      T.blinks.forEach(([at, state]) => { if (tRaw >= at) { on = state; seq += state ? '● ' : '○ '; } });
      out += flashlight(PCX - 70, PCY - 4, d(T.flash), on);
      if (seq) out += `<text class="txt" x="${PCX}" y="${PANEL.y + PANEL.h - 16}" font-size="28" text-anchor="middle" fill="#2457d6">${seq.trim()}</text>`;
    } else if (tRaw < T.tablet) {
      out += rings(PCX, PCY + 2, tRaw, { max: 120, speed: 140, count: 6, blink: true }) + router(PCX, PCY + 22, d(T.fast, 0.4), 0.65);
      if (tRaw >= T.millions) {
        const n = Math.floor((tRaw - T.millions) * 3170000 + 1000000);
        out += `<rect x="${PCX - 92}" y="${PANEL.y + 10}" width="184" height="40" rx="8" fill="#ffffff" stroke="none"/>
          <text class="txt" x="${PCX}" y="${PANEL.y + 40}" font-size="32" text-anchor="middle">${n.toLocaleString('en-US')}</text>
          <text class="txt" x="${PCX}" y="${PANEL.y + PANEL.h - 12}" font-size="24" text-anchor="middle">blinks every second</text>`;
      }
    } else {
      out += tablet(PCX, PCY + 2, d(T.tablet));
      // the tiny part inside that sees the light, circled when he says "tiny"
      const chip = { x: PCX + 52, y: PCY + 34 };
      if (tRaw >= T.tiny) {
        out += `<g class="ink thin"><rect x="${chip.x - 9}" y="${chip.y - 6}" width="18" height="12" rx="2" fill="#ffffff"/>
          <path d="M${chip.x - 5} ${chip.y - 6} V${chip.y - 10} M${chip.x} ${chip.y - 6} V${chip.y - 10} M${chip.x + 5} ${chip.y - 6} V${chip.y - 10}"/></g>
          <circle class="ink hair" cx="${chip.x}" cy="${chip.y}" r="${(16 + 3 * Math.sin(tRaw * 8)).toFixed(1)}" ${draw(d(T.tiny, 0.4))}/>`;
        if (tRaw < T.dots) out += rings(chip.x, chip.y, tRaw, { max: 46, speed: 60, count: 3, blink: true });
      }
      if (tRaw >= T.picture && tRaw < T.dots) out += sun(PCX - 14, PCY - 2, d(T.picture, 0.6));
      if (tRaw >= T.dots) out += sunInBlinks(PCX - 14, PCY - 2, d(T.dots, 0.8), tRaw);
    }
    out += '</g>';
  }

  // Dad: points at the board when something new appears on it, otherwise talks with his hands
  const changes = [T.lamp, T.routerIsLamp, T.cantSee, T.car, T.flash, T.fast, T.tablet, T.tiny, T.picture, T.dots];
  const dadLine = line && line.who === 'dad';
  const pointing = dadLine && changes.some(c => between(tRaw, c, c + 1.6));
  const wt = (id, word, n = 0) => wordTime(L[id], word, n);
  const pose = poseAt([
    { from: L.k8.a, to: L.k8.b + 0.3, face: 'grin', tilt: 8 },
    { from: L.k9.a - 0.2, to: L.k9.b + 0.3, face: 'proud' },
    { from: L.k10.a, to: L.k10.b + 0.3, face: 'brows', left: 'hip' },
    { from: L.d7.a, to: wt('d7', 'called') || L.d7.a + 0.8, face: 'brows', left: 'hip' },
    { from: L.k12.a, to: L.k12.b + 0.3, face: 'wink' },
    { from: L.d9.a, to: (wt('d9', 'router') || L.d9.a + 0.8), face: 'proud' },
    { from: wt('d9', 'millions'), to: wt('d9', 'millions') + 1.2, face: 'brows', arm: 'up' },
    { from: L.k13.a, to: L.k13.b + 0.3, face: 'grin', tilt: -7 },
    { from: L.k14.a, to: L.k14.b, face: 'think', arm: 'chin' },
    { from: wt('d11', 'lot'), to: wt('d11', 'lot') + 1, face: 'brows', arm: 'up' },
    ...laughs('dad'),
  ], tRaw);
  const nodNow = nod(tRaw, L.d7.a, 0.5) + nod(tRaw, L.d9.a, 0.5);
  out += dad(DAD_X, t, Object.assign({ arm: pointing ? 'point' : dadLine ? 'talk' : 'rest', mouth: mouthLevel('dad', tRaw), nod: nodNow }, pose));

  // Daughter
  let face = 'listen', look = 'left', arms = 'tablet';
  if (between(tRaw, L.k8.a - 0.1, L.k8.b + 0.3)) face = 'curious';
  else if (between(tRaw, L.k10.a - 0.1, L.k10.b + 0.4)) face = 'flat';
  else if (zoomed) { face = 'viewer'; look = 'front'; }
  else if (between(tRaw, L.k12.a - 0.1, L.k12.b + 0.3)) face = 'wow';
  else if (between(tRaw, L.k13.a - 0.1, L.k13.b + 0.4)) { face = 'wow'; arms = 'up'; }
  else if (between(tRaw, L.k14.a - 0.1, L.k14.b + 0.3)) face = 'curious';
  out += kid(KID_X, t, { scale: 1, face: poseAt(laughs('kid'), tRaw).face || face, look, mouth: mouthLevel('kid', tRaw), arms });

  out += speech(line, DAD_X, KID_X, tRaw);

  // Close-up while she asks the viewer
  const p = seg(tRaw, T.zoomIn, T.zoomIn + 0.28) * (1 - seg(tRaw, T.zoomOut, T.zoomOut + 0.28));
  return closeUp(out, p, 'kid', KID_X, line);
}
</script>
</body>
</html>
